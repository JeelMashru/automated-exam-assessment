version: '3.8'

services:
  examjudge:
    build: .
    container_name: examjudge-ai
    ports:
      - "8501:8501"
    environment:
      - LLM_PROVIDER=gemini
      - LLM_MODEL=gemini-2.5-flash
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
    volumes:
      - ./data:/app/data
      - ./reports:/app/reports
      - ./uploads:/app/uploads
    restart: unless-stopped
